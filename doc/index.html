<!DOCTYPE html>
<html lang="en" data-pele-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>pele_dart — Pure-Dart Mermaid to SVG Renderer</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Pure-Dart Mermaid diagram layout and SVG renderer ported 1:1 from obsidianmd/pele (pele.run), outputting themeable CSS-variable SVG and flattened vector_graphics SVG." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="doc/images/pele_logo.svg" />

  <!-- Base Docsify Layout -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />

  <style>
    /* ==========================================================================
       pele.run Design System & Flexoki Theme Tokens
       Ported from obsidianmd/pele website/src/styles/{base,pele-theme,docs,code,tables}.scss
       ========================================================================== */
    :root,
    html[data-pele-theme="dark"] {
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter Variable", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "Cascadia Code", "IBM Plex Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;
      --radius-small: 6px;
      --radius-panel: 12px;
      --radius-pill: 999px;

      /* Flexoki Dark (pele.run default) */
      --ink: #100f0f;
      --panel: #1c1b1a;
      --panel-elevated: #242321;
      --line: #282726;
      --line-hover: #343331;
      --line-active: #403e3c;
      --faint: #575653;
      --muted: #878580;
      --body: #cecdc3;
      --paper: #cecdc3;
      --paper-bright: #f2f0e5;
      --volcano: #ec8b49;
      --red: #d14d41;
      --orange: #da702c;
      --yellow: #d0a215;
      --green: #879a39;
      --cyan: #3aa99f;
      --blue: #4385be;
      --purple: #8b7ec8;
      --magenta: #ce5d97;

      /* Flexoki 300 Syntax Accents */
      --syntax-red: #e8705f;
      --syntax-orange: #ec8b49;
      --syntax-yellow: #dfb431;
      --syntax-green: #a0af54;
      --syntax-cyan: #5abdac;
      --syntax-blue: #66a0c8;
      --syntax-purple: #a699d0;
      --syntax-magenta: #e47da8;
      --syntax-muted: #9f9d96;
      --syntax-comment: #6f6e69;

      /* --pele-* CSS Custom Properties for Live Diagram Theming */
      --pele-font: var(--font-sans);
      --pele-font-mono: var(--font-mono);
      --pele-radius: var(--radius-small);
      --pele-bg: #100f0f;
      --pele-fg: #cecdc3;
      --pele-muted: #878580;
      --pele-line: #cecdc3;
      --pele-surface: #1c1b1a;
      --pele-surface-alt: #282726;
      --pele-border: #403e3c;
      --pele-accent: #4385be;
      --pele-critical: #d14d41;
      --pele-series-1: #d14d41;
      --pele-series-2: #da702c;
      --pele-series-3: #d0a215;
      --pele-series-4: #879a39;
      --pele-series-5: #3aa99f;
      --pele-series-6: #4385be;
      --pele-series-7: #8b7ec8;
      --pele-series-8: #ce5d97;

      --theme-color: #ec8b49;
      color-scheme: dark;
    }

    html[data-pele-theme="light"] {
      /* Flexoki Light (Warm Paper) */
      --ink: #fffcf0;
      --panel: #f2f0e5;
      --panel-elevated: #e6e4d9;
      --line: #e6e4d9;
      --line-hover: #dad8ce;
      --line-active: #cecdc3;
      --faint: #b7b5ac;
      --muted: #6f6e69;
      --body: #100f0f;
      --paper: #100f0f;
      --paper-bright: #100f0f;
      --volcano: #bc5215;
      --red: #af3029;
      --orange: #bc5215;
      --yellow: #ad8301;
      --green: #66800b;
      --cyan: #24837b;
      --blue: #205ea6;
      --purple: #5e409d;
      --magenta: #a02f6f;

      /* Flexoki 600 Syntax Accents for Light Paper */
      --syntax-red: #af3029;
      --syntax-orange: #bc5215;
      --syntax-yellow: #ad8301;
      --syntax-green: #66800b;
      --syntax-cyan: #24837b;
      --syntax-blue: #205ea6;
      --syntax-purple: #5e409d;
      --syntax-magenta: #a02f6f;
      --syntax-muted: #6f6e69;
      --syntax-comment: #878580;

      /* --pele-* CSS Custom Properties for Live Diagram Theming */
      --pele-bg: #fffcf0;
      --pele-fg: #100f0f;
      --pele-muted: #6f6e69;
      --pele-line: #100f0f;
      --pele-surface: #f2f0e5;
      --pele-surface-alt: #e6e4d9;
      --pele-border: #cecdc3;
      --pele-accent: #205ea6;
      --pele-critical: #af3029;
      --pele-series-1: #af3029;
      --pele-series-2: #bc5215;
      --pele-series-3: #ad8301;
      --pele-series-4: #66800b;
      --pele-series-5: #24837b;
      --pele-series-6: #205ea6;
      --pele-series-7: #5e409d;
      --pele-series-8: #a02f6f;

      --theme-color: #bc5215;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background-color: var(--ink) !important;
      color: var(--body) !important;
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    ::selection {
      background: rgba(236, 139, 73, 0.22);
    }

    /* Top Header Bar (pele.run wordmark + pill actions) */
    .pele-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: color-mix(in srgb, var(--ink) 90%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .pele-wordmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--paper-bright);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .pele-wordmark svg {
      width: 32px;
      height: 24px;
      flex-shrink: 0;
    }

    .pele-wordmark-tag {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--line-hover);
    }

    .pele-topbar-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pele-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line-hover);
      background: transparent;
      color: var(--paper);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .pele-pill-btn:hover {
      background: var(--panel);
      border-color: var(--faint);
      color: var(--paper-bright);
    }

    .pele-pill-btn-primary {
      background: var(--paper);
      color: var(--ink) !important;
      border-color: var(--paper);
      font-weight: 600;
    }

    .pele-pill-btn-primary:hover {
      background: var(--volcano);
      border-color: var(--volcano);
      color: #100f0f !important;
    }

    /* Sidebar Navigation (pele.run docs-toc style) */
    .sidebar {
      top: 60px !important;
      width: 268px !important;
      background-color: var(--ink) !important;
      border-right: 1px solid var(--line) !important;
      color: var(--body) !important;
      padding: 8px 0 56px !important;
    }

    .sidebar > h1 {
      display: none;
    }

    .sidebar-toggle {
      position: fixed !important;
      top: auto !important;
      bottom: 14px !important;
      left: 14px !important;
      width: 36px !important;
      height: 36px !important;
      padding: 8px !important;
      border-radius: var(--radius-small) !important;
      background-color: var(--panel) !important;
      border: 1px solid var(--line-hover) !important;
      z-index: 45 !important;
      cursor: pointer;
    }

    .sidebar-toggle span {
      background-color: var(--paper) !important;
    }

    .content {
      left: 268px;
      padding-top: 68px !important;
      background-color: var(--ink) !important;
    }

    body.close .content {
      left: 0;
    }

    .markdown-section {
      max-width: 880px !important;
      padding: 36px 48px 88px !important;
      color: var(--body) !important;
    }

    /* Search Input */
    .search {
      border-bottom: 1px solid var(--line) !important;
      margin-bottom: 14px !important;
      padding: 12px 16px !important;
    }

    .search input {
      background: var(--panel) !important;
      color: var(--paper) !important;
      border: 1px solid var(--line-hover) !important;
      border-radius: var(--radius-pill) !important;
      padding: 7px 14px !important;
      font-size: 0.85rem !important;
    }

    .search input:focus {
      border-color: var(--volcano) !important;
      outline: none !important;
    }

    .search .matching-post {
      border-bottom: 1px solid var(--line) !important;
    }

    /* Sidebar Links */
    .sidebar ul {
      margin: 0 0 4px 0 !important;
      padding: 0 14px !important;
    }

    .sidebar ul ul {
      padding-left: 12px !important;
      border-left: 1px solid var(--line);
      margin-left: 6px !important;
    }

    .sidebar ul li p {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      margin: 18px 0 6px 6px;
    }

    .sidebar ul li a {
      color: var(--muted) !important;
      font-size: 0.875rem;
      line-height: 1.35;
      padding: 5px 8px;
      border-radius: var(--radius-small);
      transition: color 160ms ease, background 160ms ease;
    }

    .sidebar ul li a:hover {
      color: var(--paper-bright) !important;
      background: var(--panel);
      text-decoration: none;
    }

    .sidebar ul li.active > a {
      color: var(--paper-bright) !important;
      background: var(--panel);
      border-right: 2px solid var(--volcano) !important;
      font-weight: 600;
    }

    /* Typography (pele.run docs.scss) */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5 {
      color: var(--paper-bright) !important;
      font-weight: 600 !important;
      letter-spacing: -0.02em;
    }

    .markdown-section h1 span,
    .markdown-section h2 span,
    .markdown-section h3 span,
    .markdown-section h4 span {
      color: var(--paper-bright) !important;
    }

    .markdown-section h1 {
      font-size: clamp(1.85rem, 3.2vw, 2.35rem) !important;
      line-height: 1.2;
      margin-top: 0 !important;
      margin-bottom: 20px !important;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .markdown-section h1 img {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
      height: 34px;
      width: auto;
    }

    .markdown-section h2 {
      font-size: 1.35rem !important;
      margin: 48px 0 16px !important;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .markdown-section h3 {
      font-size: 1.08rem !important;
      margin: 32px 0 12px !important;
    }

    .markdown-section p,
    .markdown-section ul,
    .markdown-section ol {
      color: var(--body);
      line-height: 1.62;
    }

    .markdown-section ul li::marker {
      color: var(--faint);
    }

    .markdown-section strong {
      color: var(--paper-bright) !important;
      font-weight: 600;
    }

    .markdown-section a {
      color: var(--paper-bright) !important;
      text-decoration: underline;
      text-decoration-color: var(--faint);
      text-underline-offset: 3px;
      transition: color 150ms ease, text-decoration-color 150ms ease;
    }

    .markdown-section a.anchor {
      text-decoration: none !important;
    }

    .markdown-section a:hover {
      color: var(--volcano) !important;
      text-decoration-color: var(--volcano);
    }

    .markdown-section hr {
      border: none !important;
      border-bottom: 1px solid var(--line) !important;
      margin: 36px 0 !important;
    }

    /* Blockquotes (pele.run rounded panel callout) */
    .markdown-section blockquote {
      border-left: 3px solid var(--volcano) !important;
      border-radius: var(--radius-panel);
      background: var(--panel) !important;
      padding: 16px 20px !important;
      color: var(--body) !important;
      margin: 24px 0 !important;
    }

    .markdown-section blockquote p {
      color: var(--body) !important;
      margin: 0;
    }

    /* Code Spans & Code Blocks (pele.run code.scss + Flexoki 300 syntax) */
    .markdown-section code {
      font-family: var(--font-mono) !important;
      background-color: var(--panel) !important;
      color: var(--paper-bright) !important;
      border: 1px solid var(--line);
      padding: 2px 6px !important;
      border-radius: var(--radius-small) !important;
      font-size: 0.86em !important;
    }

    .pele-codeblock {
      position: relative;
      margin: 22px 0;
      border-radius: var(--radius-panel);
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .pele-codeblock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      padding: 6px 12px 6px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      font-family: var(--font-mono);
    }

    .pele-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 1px solid transparent;
      border-radius: var(--radius-small);
      background: transparent;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 0.76rem;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease;
    }

    .pele-copy-btn:hover {
      background: var(--line-hover);
      color: var(--paper-bright);
    }

    .markdown-section pre {
      margin: 0 !important;
      padding: 16px 20px !important;
      background: var(--panel) !important;
      color: var(--paper) !important;
      font-family: var(--font-mono) !important;
      font-size: 0.875rem !important;
      line-height: 1.68 !important;
      overflow-x: auto;
    }

    .markdown-section pre::after {
      display: none !important;
      content: none !important;
    }

    .markdown-section pre > code {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: var(--paper) !important;
      font-size: inherit !important;
    }

    /* Flexoki 300 Syntax Highlighting */
    .token.comment,
    .token.prolog,
    .token.doctype { color: var(--syntax-comment) !important; font-style: italic; }
    .token.punctuation { color: var(--syntax-muted) !important; }
    .token.keyword,
    .token.operator { color: var(--syntax-green) !important; }
    .token.class-name,
    .token.type { color: var(--syntax-yellow) !important; }
    .token.function,
    .token.method { color: var(--syntax-orange) !important; }
    .token.string,
    .token.attr-value,
    .token.regex { color: var(--syntax-cyan) !important; }
    .token.number,
    .token.boolean,
    .token.constant { color: var(--syntax-purple) !important; }
    .token.builtin,
    .token.tag,
    .token.selector { color: var(--syntax-magenta) !important; }
    .token.property,
    .token.attr-name { color: var(--syntax-blue) !important; }

    /* Tables (pele.run tables.scss clean horizontal rule style) */
    .markdown-section table {
      display: table !important;
      width: 100%;
      margin: 24px 0;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .markdown-section table tr {
      background: transparent !important;
      border-top: none !important;
    }

    .markdown-section table tr:nth-child(2n) {
      background: transparent !important;
    }

    .markdown-section table th,
    .markdown-section table td {
      border: none !important;
      border-bottom: 1px solid var(--line) !important;
      padding: 12px 14px !important;
      text-align: left;
      vertical-align: top;
    }

    .markdown-section table th {
      color: var(--muted) !important;
      font-weight: 500;
      font-size: 0.84rem;
      border-bottom: 1px solid var(--line-active) !important;
    }

    .markdown-section table td:first-child {
      color: var(--paper-bright);
    }

    /* Collapsible <details> (for Diagram Gallery "View Mermaid Source") */
    details {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 10px 16px;
      margin: 14px 0 28px;
    }

    details summary {
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      user-select: none;
      transition: color 150ms ease;
    }

    details summary:hover {
      color: var(--paper-bright);
    }

    details[open] summary {
      margin-bottom: 12px;
      color: var(--paper-bright);
    }

    /* Live Themeable pele_dart SVG Diagram Cards */
    .pele-diagram-card {
      background: var(--pele-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 24px;
      margin: 20px 0;
      overflow-x: auto;
      text-align: center;
      transition: background-color 0.18s ease, border-color 0.18s ease;
    }

    .pele-diagram-card svg.pele {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Shield Badges & Standalone Images */
    .markdown-section a > img[src*="shields.io"],
    .markdown-section p > img[src*="shields.io"] {
      border: none !important;
      border-radius: 4px !important;
      background: transparent !important;
      padding: 0 !important;
      margin-right: 4px;
      vertical-align: middle;
    }

    .markdown-section img {
      max-width: 100%;
      border-radius: var(--radius-panel);
      border: 1px solid var(--line);
    }

    /* Pagination Footer */
    .docsify-pagination-container {
      border-top: 1px solid var(--line) !important;
      margin-top: 56px !important;
    }

    .pagination-item-title {
      color: var(--paper-bright) !important;
      font-weight: 600;
    }

    .pagination-item-label {
      color: var(--muted) !important;
    }

    @media (max-width: 768px) {
      .pele-wordmark-tag,
      .pele-hide-mobile {
        display: none;
      }
      .content {
        left: 0 !important;
      }
      .markdown-section {
        padding: 24px 20px 64px !important;
      }
    }
  </style>
</head>

  <header class="pele-topbar">

  <!-- Pre-rendered SvgOutputMode.cssVariables SVGs emitted by pele_dart -->
  <script src="pele_diagrams.js"></script>

  <script>
    // Theme Management (Flexoki Dark default matching pele.run, with Flexoki Light Paper toggle)
    (function () {
      const saved = localStorage.getItem('pele-dart-docs-theme');
      const initial = saved || 'dark';

      function applyPeleTheme(theme) {
        document.documentElement.setAttribute('data-pele-theme', theme);
        localStorage.setItem('pele-dart-docs-theme', theme);
        const label = document.getElementById('pele-theme-label');
        if (label) {
          label.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
        }
      }

      applyPeleTheme(initial);

      window.addEventListener('DOMContentLoaded', function () {
        applyPeleTheme(document.documentElement.getAttribute('data-pele-theme') || initial);
        const btn = document.getElementById('pele-theme-toggle');
        if (btn) {
          btn.addEventListener('click', function () {
            const current = document.documentElement.getAttribute('data-pele-theme') === 'dark' ? 'light' : 'dark';
            applyPeleTheme(current);
          });
        }
      });
    })();

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.copyPeleCode = function (btn) {
      const wrapper = btn.closest('.pele-codeblock');
      if (!wrapper) return;
      const codeEl = wrapper.querySelector('pre code');
      if (!codeEl) return;
      navigator.clipboard.writeText(codeEl.textContent || '').then(function () {
        const orig = btn.innerHTML;
        btn.textContent = '✓ Copied';
        setTimeout(function () { btn.innerHTML = orig; }, 1400);
      });
    };

    // Upgrade standalone gallery <img> tags and non-<details> Mermaid code blocks to live CSS-var pele_dart SVGs
    window.hydratePeleDartDiagrams = function () {
      // 1. Upgrade <img src="...images/diagrams/<id>.svg"> to inline theme-reactive SvgOutputMode.cssVariables SVGs
      if (window.PELE_DART_GALLERY_SVGS) {
        const imgs = document.querySelectorAll('.markdown-section img[src*="images/diagrams/"]');
        imgs.forEach(function (img) {
          const src = img.getAttribute('src') || '';
          const match = src.match(/images\/diagrams\/([a-z0-9_-]+)\.svg$/i);
          if (!match) return;
          const id = match[1];
          const svgMarkup = window.PELE_DART_GALLERY_SVGS[id];
          if (!svgMarkup) return;
          const wrapper = document.createElement('div');
          wrapper.className = 'pele-diagram-card';
          wrapper.innerHTML = svgMarkup;
          img.parentNode.replaceChild(wrapper, img);
        });
      }

      // 2. Upgrade standalone ```mermaid blocks (outside <details> source disclosures) to live pele_dart SVGs
      if (window.PELE_DART_DIAGRAMS) {
        const slots = document.querySelectorAll('.pele-mermaid-slot[data-mermaid-src]');
        slots.forEach(function (slot) {
          // Inside <details><summary>View Mermaid Source</summary>, keep as copyable source code
          if (slot.closest('details')) return;
          const code = decodeURIComponent(slot.getAttribute('data-mermaid-src') || '');
          const svgMarkup = window.PELE_DART_DIAGRAMS[code];
          if (!svgMarkup) return;
          const card = document.createElement('div');
          card.className = 'pele-diagram-card';
          card.innerHTML = svgMarkup;
          slot.parentNode.replaceChild(card, slot);
        });
      }
    };

    window.$docsify = {
      name: 'pele_dart',
      repo: '',
      homepage: 'README.md',
      loadSidebar: '_sidebar.md',
      relativePath: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: [
          '/',
          '/doc/API_MANUAL.md',
          '/doc/DIAGRAM_GALLERY.md',
          '/doc/BENCHMARKS.md',
          '/doc/STUDIO_GUIDE.md',
          '/doc/ARCHITECTURE.md',
          '/UPSTREAM.md',
          '/doc/UPSTREAM_SYNC.md',
          '/CHANGELOG.md',
        ],
        placeholder: 'Search pele_dart docs...',
        noData: 'No matching documentation found.',
        depth: 3,
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            const rendered = this.origin.code.apply(this, arguments);
            const label = (lang || 'text').toLowerCase();
            const blockHtml =
              '<div class="pele-codeblock">' +
                '<div class="pele-codeblock-header">' +
                  '<span>' + escapeHtml(label) + '</span>' +
                  '<button type="button" class="pele-copy-btn" onclick="window.copyPeleCode(this)">Copy</button>' +
                '</div>' +
                rendered +
              '</div>';
            if (lang === 'mermaid') {
              return (
                '<div class="pele-mermaid-slot" data-mermaid-src="' +
                encodeURIComponent(code.trim()) +
                '">' +
                blockHtml +
                '</div>'
              );
            }
            return blockHtml;
          },
        },
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            window.hydratePeleDartDiagrams();
          });
        },
      ],
    };
  </script>
