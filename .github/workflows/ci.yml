name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze, Test & Validate Docs (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed lib test tool studio/lib example/main.dart

      - name: Run static analysis
        run: dart analyze --fatal-infos lib test tool example

      - name: Run test suite (including 1:1 version lockstep & doc examples)
        run: dart test

      - name: Verify upstream header & 1:1 version lockstep
        run: dart run tool/verify_against_upstream.dart

      - name: Verify git release tag matches pubspec.yaml and UPSTREAM.md
        if: github.ref_type == 'tag'
        run: |
          PUBSPEC_VER=$(awk '/^version:/ {print $2}' pubspec.yaml)
          EXPECTED_TAG="v${PUBSPEC_VER}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Error: Git tag '${GITHUB_REF_NAME}' does not match pubspec.yaml version ('${EXPECTED_TAG}')."
            exit 1
          fi
          echo "Verified tag ${GITHUB_REF_NAME} matches pubspec.yaml (${PUBSPEC_VER}) and UPSTREAM.md."

      - name: Verify pure-Dart example runs
        run: dart run example/main.dart

      - name: Validate Dartdoc generation
        run: dart doc --dry-run

      - name: Validate pub.dev publish readiness
        run: dart pub publish --dry-run
