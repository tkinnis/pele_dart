name: pele_dart_comparison_demo
description: >-
  macOS 3-way comparison and visual/SVG text diff demo application comparing
  pele_dart, obsidianmd/pele (JS), and mermaid.js across all supported diagram families.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  pele_dart:
    path: ../
  vector_graphics: ^1.2.6
  vector_graphics_compiler: ^1.3.4
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/pele.bundle.js
    - assets/mermaid.min.js
    - assets/app_icon.png
