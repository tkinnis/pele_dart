<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 996 254" width="996" height="254" fill="#24292e" role="graphics-document document" aria-roledescription="timeline" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13"><rect x="0" y="0" width="996" height="254" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1" stroke-opacity="0.35"/><text class="pele-title" font-weight="bold" text-anchor="middle" xml:space="preserve"><tspan x="498" y="25.6">Timeline of the Hawaiian Islands</tspan></text><path class="pele-axis" d="M8,156H981" fill="none" stroke="#24292e"/><path class="pele-marker" d="M988,156L980,159.36L980,152.64Z" fill="#24292e" stroke="none"/><g class="pele-cluster pele-section" data-id="Older islands"><rect x="8" y="48" width="568" height="40" fill="#4c78a8" rx="6"/><text font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve"><tspan x="292" y="73.6">Older islands</tspan></text><g class="pele-node pele-period" data-id="Kauaʻi"><rect x="8" y="96" width="176" height="40" fill="#4c78a8" rx="6"/><text fill="#ffffff" x="96" y="121.6" text-anchor="middle">Kauaʻi</text><path class="pele-edge" d="M96,136V176" fill="none" stroke="#9c9fa1"/><circle class="pele-dot" cx="96" cy="156" r="4" fill="#4c78a8" stroke="#ffffff" stroke-width="2"/><g class="pele-node pele-event"><rect x="8" y="176" width="176" height="70" fill="#4c78a8" fill-opacity="0.16" rx="6"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="96" y="197.9">5 million years old,</tspan><tspan x="96" y="215.9">Canyons, Sea</tspan><tspan x="96" y="233.9">cliffs</tspan></text></g></g><g class="pele-node pele-period" data-id="Oʻahu"><rect x="204" y="96" width="176" height="40" fill="#4c78a8" rx="6"/><text fill="#ffffff" x="292" y="121.6" text-anchor="middle">Oʻahu</text><path class="pele-edge" d="M292,136V176" fill="none" stroke="#9c9fa1"/><circle class="pele-dot" cx="292" cy="156" r="4" fill="#4c7