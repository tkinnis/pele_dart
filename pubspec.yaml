name: pele_dart
description: "Pure-Dart Mermaid diagram layout and SVG renderer ported 1:1 from obsidianmd/pele, outputting themeable CSS-variable SVG and flattened vector_graphics SVG."
version: 1.13.0
homepage: https://github.com/tkinnis/pele_dart
repository: https://github.com/tkinnis/pele_dart
issue_tracker: https://github.com/tkinnis/pele_dart/issues
documentation: https://github.com/tkinnis/pele_dart/blob/main/docs/API_MANUAL.md

topics:
  - mermaid
  - svg
  - diagram
  - flowchart
  - chart

environment:
  sdk: ^3.13.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
  vector_graphics_compiler: ^1.3.0
  xml: ^6.6.1
